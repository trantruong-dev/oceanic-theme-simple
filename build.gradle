plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform' version '2.13.1'
}

group = "truong.tran"
version = "1.2.2"

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    intellijPlatform {
        intellijIdeaCommunity("2024.1")
        pluginVerifier()
    }
}

intellijPlatform {
    pluginConfiguration {
        ideaVersion {
            sinceBuild = "241"
            untilBuild = provider { null }
        }
    }
}

tasks.named('patchPluginXml') {
    changeNotes = """
      <h3> Compatibility with IU-242 </h3>
      <h3> Compatibility with IU-241 </h3>
      """
}

tasks.named('publishPlugin') {
    token = System.getenv("oceanicDark_intellijPublishToken")
}
